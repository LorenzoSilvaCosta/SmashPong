<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SmashPong</title>
<style>html,body{margin:0;height:100%;background:#0b0816;overflow:hidden}#f{position:absolute;border:0;display:block;background:#000}
</style></head>
<body><script>window.__PUBLICO=1;</script><div id="ld" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ffd25e;font:700 20px system-ui,sans-serif">Carregando SmashPong…</div><iframe id="f" allow="fullscreen; autoplay" title="SmashPong"></iframe><script>
var G=null;
var f=document.getElementById('f');
var MOB=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&matchMedia('(pointer:coarse)').matches&&!matchMedia('(pointer:fine)').matches);
/* 15.91: no site público o jogo fica em jogo.html e é buscado sempre novo (sem cache); esta página é só o carregador */
function withG(cb){ if(G!==null){ var g=G; G=null; return cb(g); }
  fetch('jogo.html?v='+Date.now(),{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(cb).catch(function(){ var l=document.getElementById('ld'); if(l) l.textContent='Não deu para carregar. Recarregue a página.'; }); }
withG(function(g){
if(MOB){ /* 15.88–15.91: no celular o jogo roda direto na página (como no app), sem o iframe com zoom do PC; tela cheia no 1º toque (no jogo) */
  var l0=document.getElementById('ld'); if(l0) l0.remove(); f.remove();
  var go=function(){ setTimeout(function(){ document.open(); document.write(g); document.close(); g=null; },0); }; if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',go); else go();
} else {
function fit(){ var W=innerWidth,H=innerHeight,h=390,w=Math.round(h*W/H); w=Math.max(720,Math.min(900,w)); var z=Math.min(W/w,H/h); f.style.width=w+'px'; f.style.height=h+'px'; f.style.zoom=z; f.style.left=((W/z-w)/2)+'px'; f.style.top=((H/z-h)/2)+'px'; }
fit(); addEventListener('resize',fit); addEventListener('keydown',function(e){ var w=f.contentWindow; try{ if(w&&w.__webKey&&w.__webKey(e)) e.preventDefault(); }catch(x){} }); addEventListener('mousedown',function(){ try{ f.contentWindow.focus(); }catch(x){} }); f.addEventListener('load',function(){ var l=document.getElementById('ld'); if(l) l.remove(); try{ f.contentWindow.focus(); }catch(e){} }); f.srcdoc=g; g=null;
}
});
</script></body></html>
